# Traefik values for the local-network homelab ingress layer.
# This keeps one entrypoint for the local LAN and avoids exposing every app individually.

providers:
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true

service:
  type: LoadBalancer
  annotations:
    # Keep the uplink private and local-network only.
    # This should be a free IP in the same LAN as the VM bridge network.
    io.cilium/lb-ipam-ips: "192.168.102.205"

ports:
  web:
    port: 80
    targetPort: web
    protocol: TCP
  websecure:
    port: 443
    targetPort: websecure
    protocol: TCP

log:
  level: INFO

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 65532

ingressClass:
  enabled: true
  isDefaultClass: true
