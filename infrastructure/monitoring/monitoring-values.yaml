# 1. Prometheus server storage configuration rules
prometheus:
  prometheusSpec:
    # Explicitly instruct Prometheus to use your replicated Longhorn storage
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi # Reserves a 10GB distributed disk volume

# 2. Grafana visual visualization configurations
grafana:
  # Instruct Grafana to also hold its local dashboard settings on Longhorn
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 2Gi

  # Expose Grafana on a clean, dedicated static IP via your Cilium pool
  service:
    type: LoadBalancer
    port: 80

  # Set a default administrator password (change this to whatever you want)
  adminPassword: "admin"

  # SECURE ENVIRONMENT VARIABLE INJECTION MAPPING
  extraSecretEnvironmentVars:
    - envName: KEYCLOAK_CLIENT_SECRET
      secretName: grafana-keycloak-sso
      secretKey: client-secret

 # INJECT ENTERPRISE SINGLE SIGN-ON HANDSHAKE PARAMETERS
  grafana.ini:
    server:
      # Explicitly instructs Grafana to build callback strings using its real IP
      root_url: "http://192.168.102.203/"
      domain: "192.168.102.203"
    auth.generic_oauth:
      enabled: true
      name: "Keycloak SSO"
      allow_sign_up: true
      client_id: grafana
      client_secret: $__env{KEYCLOAK_CLIENT_SECRET}
      scopes: "openid profile email"
      auth_url: "http://192.168.102.204:80/auth/realms/vbox-cluster/protocol/openid-connect/auth"
      token_url: "http://keycloak-keycloak-chart-http.identity.svc.cluster.local:80/auth/realms/vbox-cluster/protocol/openid-connect/token"
      api_url: "http://keycloak-keycloak-chart-http.identity.svc.cluster.local:80/auth/realms/vbox-cluster/protocol/openid-connect/userinfo"
      role_attribute_path: "contains(roles[*], 'admin') && 'Admin' || 'Viewer'"
